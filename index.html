<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>GUI Bookmarklet</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.08),transparent 30%),#080808;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(720px,100%);padding:clamp(34px,7vw,62px);border:1px solid rgba(255,255,255,.09);border-radius:30px;background:rgba(255,255,255,.035);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.32)}
    .eyebrow{margin:0 0 14px;color:#777;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,8vw,72px);line-height:.98;letter-spacing:-.055em}
    p{max-width:530px;margin:22px auto 32px;color:#a7a7a7;line-height:1.65}
    .bookmark{display:inline-flex;align-items:center;gap:10px;padding:16px 22px;border-radius:16px;background:#fff;color:#080808;text-decoration:none;font-weight:800;cursor:grab;user-select:none;box-shadow:0 12px 44px rgba(0,0,0,.35);transition:.18s ease}
    .bookmark:hover{transform:translateY(-2px) scale(1.02)}.bookmark:active{cursor:grabbing;transform:scale(.98)}
    .hint{margin-top:18px;color:#666;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Bookmarklet</div>
    <h1>Drag this to your bookmarks</h1>
    <p>Drag the button below to your bookmarks bar. When you click it on a page, it opens a simple movable GUI panel.</p>
    <a class="bookmark" href="javascript:(()=>{if(document.getElementById('yo-bookmarklet-gui'))return;const d=document.createElement('div');d.id='yo-bookmarklet-gui';d.style='position:fixed;top:80px;left:80px;width:320px;z-index:2147483647;background:#111;color:#fff;border:1px solid #333;border-radius:18px;box-shadow:0 20px 70px #0008;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;overflow:hidden';const h=document.createElement('div');h.style='padding:14px 16px;background:#191919;cursor:move;font-weight:700;user-select:none;display:flex;justify-content:space-between;align-items:center';h.innerHTML='<span>GUI</span>';const x=document.createElement('button');x.textContent='×';x.style='border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer';x.onclick=()=>d.remove();h.appendChild(x);const b=document.createElement('div');b.style='padding:18px;color:#bbb;line-height:1.5';b.innerHTML='<strong style=&quot;color:white&quot;>Bookmarklet loaded.</strong><br>This is a harmless GUI-only panel.';d.append(h,b);document.body.appendChild(d);let ox=0,oy=0,drag=false;h.onpointerdown=e=>{if(e.target===x)return;drag=true;ox=e.clientX-d.offsetLeft;oy=e.clientY-d.offsetTop;h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(drag){d.style.left=e.clientX-ox+'px';d.style.top=e.clientY-oy+'px'}};h.onpointerup=()=>drag=false})()">Drag me to bookmarks</a>
    <div class="hint">Desktop browsers work best because they expose the bookmarks bar.</div>
  </main>
</body>
</html>
